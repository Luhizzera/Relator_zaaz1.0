name: Diagnóstico SMTP

# Workflow descartável. Segunda rodada.
#
# A primeira rodada mostrou secrets limpos e a porta 587 ABERTA em menos de um
# segundo — mas rodou em northcentralus, enquanto os envios que falharam saíram
# de centralus e eastus. Ou seja: provou alcance de um IP que nunca tentou
# mandar e-mail, e não reproduziu nada.
#
# Esta versão sonda o TCP e tenta o envio real no MESMO runner, no mesmo
# minuto, com o log interno do nodemailer ligado. Isso separa as duas
# explicações que sobraram:
#
#   • sonda falha + envio falha  -> bloqueio por faixa de IP. Precisa de relay.
#   • sonda passa  + envio falha -> o servidor sempre esteve alcançável e quem
#                                   erra é o nodemailer. Conserta-se a chamada.
#
# Manda para RESUMO_ALERTA, nunca para a lista de gestores.
# Apagar depois que o envio estiver resolvido.
on:
  workflow_dispatch:

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - name: Sondar antes do envio
        id: antes
        # Sem `-e`: este passo precisa chegar ao fim mesmo com comando falhando,
        # que é justamente o que ele mede.
        shell: bash --noprofile --norc {0}
        env:
          HOST: ${{ secrets.SMTP_SERVIDOR }}
          PORTA: ${{ secrets.SMTP_PORTA }}
        run: |
          echo "IP de saída deste runner: $(curl -s --max-time 10 https://api.ipify.org)"
          echo "região: $RUNNER_ENVIRONMENT"
          echo

          # Quantidade, não o valor: o endereço resolvido revelaria o host.
          n4=$(getent ahostsv4 "$HOST" 2>/dev/null | awk '{print $1}' | sort -u | wc -l)
          n6=$(getent ahostsv6 "$HOST" 2>/dev/null | awk '{print $1}' | grep -c ':')
          echo "endereços IPv4 publicados: $n4"
          echo "endereços IPv6 publicados: $n6"
          if [ "$n6" -gt 0 ]; then
            echo "  ^ tem AAAA. Os runners do GitHub não têm rota IPv6 — se o"
            echo "    nodemailer discar o v6 primeiro e não cair pro v4, dá"
            echo "    exatamente 'Connection timeout' com o servidor no ar."
          fi
          echo

          sondar() {
            timeout 15 bash -c "exec 3<>/dev/tcp/$1/$PORTA" 2>/dev/null && return 0 || return $?
          }

          echo "-- pelo nome (mesmo caminho que o nodemailer usa) --"
          sondar "$HOST" && echo "conectou" || echo "FALHOU (código $?)"

          ip4=$(getent ahostsv4 "$HOST" 2>/dev/null | awk '{print $1}' | head -1)
          echo "-- direto no IPv4, sem passar por resolução --"
          if [ -n "$ip4" ]; then
            sondar "$ip4" && echo "conectou" || echo "FALHOU (código $?)"
          else
            echo "sem endereço IPv4 — isso por si só explicaria tudo"
          fi

      # O envio de verdade, no mesmo runner que acabou de sondar. `nodemailerlog`
      # e `nodemailerdebug` despejam a conversa interna da biblioteca: qual
      # endereço ela discou, onde parou, o que o servidor respondeu.
      - name: Tentar envio real
        id: envio
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVIDOR }}
          server_port: ${{ secrets.SMTP_PORTA }}
          secure: false
          username: ${{ secrets.SMTP_USUARIO }}
          password: ${{ secrets.SMTP_SENHA }}
          from: SurveyOS <${{ secrets.SMTP_USUARIO }}>
          to: ${{ secrets.RESUMO_ALERTA }}
          subject: '[TESTE] SurveyOS — sondagem de SMTP'
          body: |
            Mensagem de teste do workflow de diagnóstico.
            Se ela chegou, o envio a partir dos runners do GitHub funciona.
          nodemailerlog: true
          nodemailerdebug: true

      - name: Sondar depois do envio
        if: always()
        shell: bash --noprofile --norc {0}
        env:
          HOST: ${{ secrets.SMTP_SERVIDOR }}
          PORTA: ${{ secrets.SMTP_PORTA }}
        run: |
          echo "resultado do envio: ${{ steps.envio.outcome }}"
          echo
          timeout 15 bash -c "exec 3<>/dev/tcp/$HOST/$PORTA" 2>/dev/null \
            && echo "sonda depois do envio: conectou" \
            || echo "sonda depois do envio: FALHOU (código $?)"
          echo
          echo "== Leitura =="
          echo "sonda conectou + envio falhou  -> o servidor está no ar; o erro é do nodemailer."
          echo "sonda falhou   + envio falhou  -> este IP está bloqueado; precisa de relay."
