name: Diagnóstico SMTP

# Coleta evidência para o chamado do firewall.
#
# O TI pediu "os IPs". Não existe lista curta: o GitHub publica 7.251 faixas
# para o Actions, 5.625 delas IPv4, cobrindo ~28 milhões de endereços, e a
# lista muda sozinha (https://api.github.com/meta, campo "actions"). Liberar
# tudo isso não é proposta séria.
#
# O que serve para procurar no log do firewall é o oposto: um IP concreto,
# com horário, que foi descartado. Cada job da matriz roda num runner
# diferente, logo com IP diferente — uma execução devolve várias amostras de
# uma vez, umas que passam e outras que não. É esse contraste, vindo do mesmo
# minuto e do mesmo destino, que fecha o diagnóstico.
#
# Só sonda TCP: nada de enviar e-mail, para não gastar 2 minutos de timeout
# por job. Já sabemos que, de um IP liberado, o envio funciona.
on:
  workflow_dispatch:

jobs:
  sondar:
    runs-on: ubuntu-latest
    strategy:
      # Sem isto, a primeira sonda bloqueada cancelaria as outras — e são
      # justamente as outras que provam que o destino está no ar.
      fail-fast: false
      matrix:
        tentativa: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      TZ: America/Sao_Paulo
    steps:
      - name: Sondar a porta de envio
        shell: bash --noprofile --norc {0}
        env:
          HOST: ${{ secrets.SMTP_SERVIDOR }}
          PORTA: ${{ secrets.SMTP_PORTA }}
        run: |
          ip=$(curl -s --max-time 10 https://api.ipify.org)
          quando=$(date '+%d/%m/%Y %H:%M:%S')

          timeout 20 bash -c "exec 3<>/dev/tcp/$HOST/$PORTA" 2>/dev/null \
            && resultado="CONECTOU" \
            || resultado="DESCARTADO (sem resposta)"

          echo "$quando (horário de Brasília) — IP $ip — $resultado"

          # Vai para a página de resumo da execução, onde os oito jobs
          # aparecem empilhados e dá para copiar tudo de uma vez pro chamado.
          echo "\`$ip\` — **$resultado** — $quando (Brasília)" >> "$GITHUB_STEP_SUMMARY"
