name: Resumo de atividade

# Segunda, quarta e sexta às 8h de Brasília. O cron do GitHub é sempre UTC e
# não entende fuso, então 08:00 BRT = 11:00 UTC — o Brasil não tem mais
# horário de verão, então esse deslocamento é fixo o ano todo.
#
# Duas ressalvas do agendador do GitHub, que valem saber antes de confiar nele:
#   • o disparo não é pontual — sob carga, atrasa de alguns minutos a dezenas;
#   • workflows agendados são desativados após 60 dias sem commit no repositório
#     (o GitHub avisa por e-mail antes).
on:
  schedule:
    - cron: '0 11 * * 1,3,5'
  # Permite rodar na hora pelo botão "Run workflow", sem esperar o horário —
  # é assim que se testa a configuração sem mexer no cron.
  workflow_dispatch:

# Necessário porque o job faz commit dos arquivos gerados de volta no repo.
permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    # Promovido a env do job porque o contexto `secrets` não é avaliado dentro
    # do `if:` de um step — só o `env` do job é. É o que permite o envio ficar
    # desligado até alguém preencher a lista de destinatários.
    env:
      DESTINATARIOS: ${{ secrets.RESUMO_DESTINATARIOS }}
      ALERTA: ${{ secrets.RESUMO_ALERTA }}
      # O runner roda em UTC. Sem fixar o fuso, uma execução perto da virada do
      # dia nomearia o arquivo com uma data e escreveria outra no cabeçalho.
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Gerar planilha e documento
        id: gerar
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          RESUMO_EMAIL: ${{ secrets.RESUMO_EMAIL }}
          RESUMO_SENHA: ${{ secrets.RESUMO_SENHA }}
        run: node scripts/resumo-atividade.mjs --sumario corpo-email.html

      - name: Publicar no repositório
        run: |
          git config user.name 'SurveyOS (robô)'
          git config user.email 'actions@github.com'
          git add Resumo_atividade/
          # Sem mudança nos dados os arquivos ainda diferem (data de geração
          # embutida), mas se por algum motivo saírem idênticos o commit vazio
          # quebraria o job — daí o guard.
          git diff --staged --quiet && echo 'Nada mudou.' && exit 0
          git commit -m "Resumo de atividade — ${{ steps.gerar.outputs.data }}"
          git push

      # Só envia se a geração deu certo — um anexo vazio ou desatualizado
      # circulando entre responsáveis é pior que e-mail nenhum.
      #
      # O passo é pulado por completo quando RESUMO_DESTINATARIOS não existe,
      # então o workflow pode ser ligado e observado por alguns ciclos antes de
      # começar a disparar e-mail pra gente de verdade.
      - name: Enviar por e-mail
        if: success() && env.DESTINATARIOS != ''
        uses: dawidd6/action-send-mail@v3
        with:
          # Servidor e porta vêm de secret: a caixa acabou sendo criada no
          # servidor de hospedagem do domínio, não no tenant 365, e um host
          # fixo aqui obrigaria a mexer no workflow a cada mudança de provedor.
          server_address: ${{ secrets.SMTP_SERVIDOR }}
          server_port: ${{ secrets.SMTP_PORTA }}
          # `secure` significa TLS implícito desde o handshake — verdadeiro só
          # na 465. A 587 abre em claro e sobe pra TLS via STARTTLS; marcar
          # true nela faz o envio travar até dar timeout, sem erro legível.
          secure: ${{ secrets.SMTP_PORTA == '465' }}
          username: ${{ secrets.SMTP_USUARIO }}
          password: ${{ secrets.SMTP_SENHA }}
          from: SurveyOS <${{ secrets.SMTP_USUARIO }}>
          to: ${{ secrets.RESUMO_DESTINATARIOS }}
          subject: 'SurveyOS — Resumo de atividade · ${{ steps.gerar.outputs.dataCompleta }}'
          html_body: file://corpo-email.html
          # Caminhos vêm do próprio script: o nome muda a cada execução, então
          # um caminho fixo aqui anexaria a versão errada — ou nenhuma.
          attachments: ${{ steps.gerar.outputs.xlsx }},${{ steps.gerar.outputs.docx }}
          convert_markdown: false

      # O e-mail é o registro durável de cada rodada, então uma falha não pode
      # virar silêncio: sem este passo, um dia sem relatório é indistinguível
      # de um dia em que ninguém reparou que faltou. Vai só pro endereço de
      # alerta, não pros gestores — quem recebe o relatório não precisa lidar
      # com erro de automação.
      - name: Avisar sobre falha
        if: failure() && env.ALERTA != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVIDOR }}
          server_port: ${{ secrets.SMTP_PORTA }}
          secure: ${{ secrets.SMTP_PORTA == '465' }}
          username: ${{ secrets.SMTP_USUARIO }}
          password: ${{ secrets.SMTP_SENHA }}
          from: SurveyOS <${{ secrets.SMTP_USUARIO }}>
          to: ${{ secrets.RESUMO_ALERTA }}
          subject: '[FALHA] SurveyOS — o resumo de hoje não foi gerado'
          body: |
            A rotina de resumo falhou e nenhum relatório foi enviado hoje.

            Execução: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Os gestores NÃO foram avisados — para eles, hoje simplesmente não
            chegou e-mail. Se o problema não for resolvido antes da próxima
            execução agendada, considere avisá-los manualmente.

      # Rede de segurança: se o push falhar (branch protegida, por exemplo), os
      # arquivos ainda ficam baixáveis pela página da execução por 90 dias.
      - name: Anexar à execução
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resumo-atividade
          path: Resumo_atividade/
          retention-days: 90
