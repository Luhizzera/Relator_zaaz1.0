name: Resumo de atividade

# Todo dia, mirando 05:41 de Brasília. O cron do GitHub é sempre UTC e não
# entende fuso, então 08:41 UTC = 05:41 BRT — o Brasil não tem mais horário de
# verão, então esse deslocamento é fixo o ano todo.
#
# Era segunda/quarta/sexta ('0 11 * * 1,3,5') até a diretoria pedir cadência
# diária. Inclui sábado e domingo porque foi isso que foi pedido; para só dias
# úteis, o campo dos dias vira '1-5'.
#
# O horário não foi escolhido por gosto. Com o cron em '0 11' (08:00 BRT), as
# três primeiras execuções automáticas saíram assim:
#
#   sáb 05/09  10:35  — 2h35 de atraso
#   dom 06/09  10:50  — 2h50
#   seg 07/09  13:07  — 5h07
#
# São duas causas somadas. A virada da hora é o horário mais disputado do
# agendador, porque todo mundo escreve '0 X * * *'; e execução agendada é a
# prioridade mais baixa da plataforma, atrás de push e pull request. Daí o
# minuto quebrado, que foge da estampida, e o adiantamento de duas horas, que
# faz o atraso típico ainda cair antes das 8h e o pior atraso já observado
# ainda cair dentro da manhã.
#
# Se algum dia a hora exata virar requisito, o agendador do GitHub não serve:
# ele não promete pontualidade em horário nenhum. A saída seria um gatilho
# externo chamando a API de workflow_dispatch.
#
# Outra ressalva, essa inofensiva no nosso caso: workflows agendados são
# desativados após 60 dias sem commit no repositório. Como cada execução
# commita o relatório do dia, esse relógio nunca chega perto de estourar.
on:
  schedule:
    - cron: '41 8 * * *'
  # Permite rodar na hora pelo botão "Run workflow", sem esperar o horário —
  # é assim que se testa a configuração sem mexer no cron.
  workflow_dispatch:

# Necessário porque o job faz commit dos arquivos gerados de volta no repo.
permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    # Promovido a env do job porque o contexto `secrets` não é avaliado dentro
    # do `if:` de um step — só o `env` do job é.
    env:
      DESTINATARIOS: ${{ secrets.RESUMO_DESTINATARIOS }}
      # O runner roda em UTC. Sem fixar o fuso, uma execução perto da virada do
      # dia nomearia o arquivo com uma data e escreveria outra no cabeçalho.
      TZ: America/Sao_Paulo
    outputs:
      dataCompleta: ${{ steps.gerar.outputs.dataCompleta }}
      temDestinatarios: ${{ steps.destinatarios.outputs.tem }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, não 20: o @supabase/supabase-js declara `node: '>=22.0.0'` e
          # usa o WebSocket global, que só existe a partir do 22. No 20 o
          # cliente nem chega a ser construído — falha em _initRealtimeClient
          # antes de qualquer consulta.
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Gerar planilha e documento
        id: gerar
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          RESUMO_EMAIL: ${{ secrets.RESUMO_EMAIL }}
          RESUMO_SENHA: ${{ secrets.RESUMO_SENHA }}
        run: node scripts/resumo-atividade.mjs --sumario corpo-email.html

      - name: Publicar no repositório
        run: |
          git config user.name 'SurveyOS (robô)'
          git config user.email 'actions@github.com'
          git add Resumo_atividade/
          # Sem mudança nos dados os arquivos ainda diferem (data de geração
          # embutida), mas se por algum motivo saírem idênticos o commit vazio
          # quebraria o job — daí o guard.
          git diff --staged --quiet && echo 'Nada mudou.' && exit 0
          git commit -m "Resumo de atividade — ${{ steps.gerar.outputs.data }}"
          git push

      # Pasta achatada com só o material do dia. Os jobs de envio rodam em
      # runners diferentes, onde os caminhos absolutos que o script emitiu não
      # existem, e `Resumo_atividade/` guarda o histórico inteiro — um glob ali
      # pegaria o relatório de outra data. Aqui há exatamente um de cada.
      - name: Empacotar para envio
        run: |
          mkdir -p envio
          cp "${{ steps.gerar.outputs.xlsx }}" "${{ steps.gerar.outputs.docx }}" corpo-email.html envio/
          ls -la envio/

      - name: Disponibilizar para os envios
        uses: actions/upload-artifact@v4
        with:
          name: envio
          path: envio/
          retention-days: 7

      # Precisa virar output porque `secrets` não é visível no `if:` de um job,
      # e é o `if:` dos jobs de envio que decide se eles chegam a existir.
      - name: Ver se há destinatários configurados
        id: destinatarios
        run: |
          if [ -n "$DESTINATARIOS" ]; then
            echo 'tem=sim' >> "$GITHUB_OUTPUT"
          else
            echo 'tem=nao' >> "$GITHUB_OUTPUT"
            echo 'RESUMO_DESTINATARIOS está vazio — nada será enviado.'
          fi

      # Rede de segurança: se o push falhar (branch protegida, por exemplo), os
      # arquivos ainda ficam baixáveis pela página da execução por 90 dias.
      - name: Anexar à execução
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resumo-atividade
          path: Resumo_atividade/
          retention-days: 90

  # ---------------------------------------------------------------------------
  # Quatro tentativas de envio, cada uma em seu próprio job.
  #
  # O servidor de e-mail descarta parte dos IPs da Azure — medimos 5 de 8
  # conexões aceitas, no mesmo segundo e contra o mesmo destino. Como o GitHub
  # sorteia o runner por job, cada tentativa aqui sai de um IP novo, e portanto
  # de um sorteio novo. Repetir dentro de um mesmo job não adiantaria: mesmo
  # runner, mesmo IP, mesmo bloqueio.
  #
  # A 62,5% por tentativa, uma entrega 62,5% das vezes; quatro entregam 98%.
  # É mitigação, não cura — a cura é liberar o IP no firewall da hospedagem ou
  # sair do SMTP. Enquanto o chamado não anda, isto segura a entrega.
  #
  # Cada job só roda se o anterior não entregou, então no caso normal só a
  # primeira tentativa existe.
  #
  # O encadeamento olha a saída `entregue`, e não o resultado do job, de
  # propósito: os jobs de envio terminam verdes mesmo quando o IP é bloqueado.
  # Assim a execução só fica vermelha quando o relatório realmente não chegou a
  # ninguém — verde passa a significar entregue, e não "rodou até o fim".
  # ---------------------------------------------------------------------------
  enviar-1:
    needs: gerar
    if: needs.gerar.outputs.temDestinatarios == 'sim'
    uses: ./.github/workflows/enviar-resumo.yml
    with:
      assunto: 'SurveyOS — Resumo de atividade · ${{ needs.gerar.outputs.dataCompleta }}'
    secrets: inherit

  enviar-2:
    needs: [gerar, enviar-1]
    if: always() && needs.enviar-1.result != 'skipped' && needs.enviar-1.outputs.entregue != 'sim'
    uses: ./.github/workflows/enviar-resumo.yml
    with:
      assunto: 'SurveyOS — Resumo de atividade · ${{ needs.gerar.outputs.dataCompleta }}'
    secrets: inherit

  enviar-3:
    needs: [gerar, enviar-1, enviar-2]
    if: always() && needs.enviar-2.result != 'skipped' && needs.enviar-2.outputs.entregue != 'sim'
    uses: ./.github/workflows/enviar-resumo.yml
    with:
      assunto: 'SurveyOS — Resumo de atividade · ${{ needs.gerar.outputs.dataCompleta }}'
    secrets: inherit

  enviar-4:
    needs: [gerar, enviar-1, enviar-2, enviar-3]
    if: always() && needs.enviar-3.result != 'skipped' && needs.enviar-3.outputs.entregue != 'sim'
    uses: ./.github/workflows/enviar-resumo.yml
    with:
      assunto: 'SurveyOS — Resumo de atividade · ${{ needs.gerar.outputs.dataCompleta }}'
    secrets: inherit

  # O e-mail é o registro durável de cada rodada, então uma falha não pode
  # virar silêncio: sem este job, um dia sem relatório é indistinguível de um
  # dia em que ninguém reparou que faltou. Vai só pro endereço de alerta, não
  # pros gestores — quem recebe o relatório não precisa lidar com erro de
  # automação.
  #
  # Roda em runner próprio, logo tem o próprio sorteio de IP. Se as quatro
  # tentativas falharem e o aviso também, a execução ainda fica marcada como
  # falha na aba Actions, e o GitHub notifica quem mexeu no cron por último.
  avisar:
    needs: [gerar, enviar-1, enviar-2, enviar-3, enviar-4]
    if: always() && (needs.gerar.result == 'failure' || (needs.enviar-4.result != 'skipped' && needs.enviar-4.outputs.entregue != 'sim'))
    runs-on: ubuntu-latest
    env:
      ALERTA: ${{ secrets.RESUMO_ALERTA }}
    steps:
      - name: Avisar sobre falha
        if: env.ALERTA != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVIDOR }}
          server_port: ${{ secrets.SMTP_PORTA }}
          secure: ${{ secrets.SMTP_PORTA == '465' }}
          username: ${{ secrets.SMTP_USUARIO }}
          password: ${{ secrets.SMTP_SENHA }}
          from: SurveyOS <${{ secrets.SMTP_USUARIO }}>
          to: ${{ secrets.RESUMO_ALERTA }}
          subject: '[FALHA] SurveyOS — o resumo de hoje não foi entregue'
          body: |
            A rotina de resumo não conseguiu entregar o relatório hoje.

            Execução: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Os gestores NÃO foram avisados — para eles, hoje simplesmente não
            chegou e-mail. Os arquivos estão commitados em Resumo_atividade/ e
            anexados à execução, prontos para envio manual.

      # Como os jobs de envio terminam verdes por desenho, este é o único lugar
      # que pinta a execução de vermelho — e ele significa exatamente uma coisa:
      # o relatório não chegou a ninguém. Roda mesmo sem endereço de alerta
      # configurado, senão a falha sumiria da aba Actions também.
      - name: Reprovar a execução
        run: |
          echo 'Nenhuma das quatro tentativas entregou o relatório.'
          exit 1
