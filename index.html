  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>SurveyOS</title>
    <meta name="description" content="Relatórios fotográficos e ordens de manutenção — geração de relatórios em PDF/DOCX e gestão de OS de campo." />
    <meta name="author" content="Departamento de Engenharia" />

    <link rel="icon" type="image/png" href="/images/Eng-zaaz.png" />
    <link rel="apple-touch-icon" href="/images/Eng-zaaz.png" />

    <meta property="og:title" content="SurveyOS" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="SurveyOS" />
    <meta name="twitter:image" content="/images/Eng-zaaz.png" />

    <script>
      // Aplica o tema salvo ANTES do React montar, pra não piscar claro/escuro
      // na primeira renderização. Mesma lógica do ThemeContext.tsx.
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved === 'dark' || (!saved && prefersDark);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
